name: uncertainty-service

services:
  api:
    build: .
    image: uncertainty-service:latest
    environment:
      API_PORT: ${API_PORT:-8000}
    ports:
      # Host port is configurable: API_PORT=9000 docker compose up api
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    healthcheck:
      # Confirms the service can actually receive HTTP requests.
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          urllib.request.urlopen(
            "http://127.0.0.1:" + os.environ.get("API_PORT", "8000") + "/healthz",
            timeout=2).read()
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s

  verify:
    image: uncertainty-service:latest
    build: .
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:${API_PORT:-8000}
      APP_ROOT: /app
    command: ["python", "/app/verify/verify.py"]
    restart: "no"
